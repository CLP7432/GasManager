services:
  # ===== MYSQL 8.0.44 =====
  mysql8:
    container_name: mysql8
    image: mysql:8.0.44
    ports:
      - "3307:3306"
    environment:
      #MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: gasmanager_ventas
    volumes:
      - data-mysql:/var/lib/mysql
    restart: always
    networks:
      - gasmanager-network
    command: --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== EUREKA SERVER =====
  msvc-eureka:
    container_name: msvc-eureka
    build:
      context: ./
      dockerfile: ./microservice-eureka/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - gasmanager-network
    restart: always

  # ===== GATEWAY =====
  msvc-gateway:
    container_name: msvc-gateway
    build:
      context: ./
      dockerfile: ./microservice-gateway/Dockerfile
    ports:
      - "8085:8085"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
    restart: always

  # ===== VENTAS =====
  msvc-ventas:
    container_name: msvc-ventas
    build:
      context: ./
      dockerfile: ./microservice-ventas/Dockerfile
    ports:
      - "8082:8082"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== USERS =====
  msvc-users:
    container_name: msvc-users
    build:
      context: ./
      dockerfile: ./microservice-users/Dockerfile
    ports:
      - "8081:8081"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== CLIENTES =====
  msvc-clientes:
    container_name: msvc-clientes
    build:
      context: ./
      dockerfile: ./microservice-clientes/Dockerfile
    ports:
      - "8093:8093"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== FACTURACION =====
  msvc-facturacion:
    container_name: msvc-facturacion
    build:
      context: ./
      dockerfile: ./microservice-facturacion/Dockerfile
    ports:
      - "8094:8094"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== NOMINA =====
  msvc-nomina:
    container_name: msvc-nomina
    build:
      context: ./
      dockerfile: ./microservice-nomina/Dockerfile
    ports:
      - "8095:8095"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== COMPRAS =====
  msvc-compras:
    container_name: msvc-compras
    build:
      context: ./
      dockerfile: ./microservice-compras/Dockerfile
    ports:
      - "8096:8096"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== INVENTARIOS =====
  msvc-inventarios:
    container_name: msvc-inventarios
    build:
      context: ./
      dockerfile: ./microservice-inventarios/Dockerfile
    ports:
      - "8092:8092"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== REPORTES =====
  msvc-reportes:
    container_name: msvc-reportes
    build:
      context: ./
      dockerfile: ./microservice-reportes/Dockerfile
    ports:
      - "8099:8099"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== IA =====
  msvc-ia:
    container_name: msvc-ia
    build:
      context: ./
      dockerfile: ./microservice-ia/Dockerfile
    ports:
      - "8097:8097"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
    restart: always

  # ===== LEALTAD =====
  msvc-lealtad:
    container_name: msvc-lealtad
    build:
      context: ./
      dockerfile: ./microservice-lealtad/Dockerfile
    ports:
      - "8100:8100"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
      - mysql8
    restart: always

  # ===== IOT =====
  msvc-iot:
    container_name: msvc-iot
    build:
      context: ./
      dockerfile: ./microservice-iot/Dockerfile
    ports:
      - "8098:8098"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-eureka
    restart: always

  # ===== FRONTEND =====
  frontend:
    container_name: frontend
    build:
      context: ./gasmanager-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - gasmanager-network
    depends_on:
      - msvc-gateway
      - msvc-eureka
    restart: always

volumes:
  data-mysql:
    name: data-mysql

networks:
  gasmanager-network:
    name: gasmanager-network
